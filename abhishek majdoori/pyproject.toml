[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================
[project]
name = "handshake-project-watcher"
version = "0.1.0"
description = "Monitors the Handshake AI Projects page and notifies you when new projects appear."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Abhishek Majdoori" }]
keywords = ["handshake", "watcher", "notification", "scraper", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # Browser automation — headless Chromium to load Handshake pages
    "playwright>=1.44.0",

    # HTML parsing — fast, lenient parser for scraping project listings
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",

    # Settings management — typed config from .env files
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Windows desktop notifications
    "plyer>=2.1.0",

    # System-tray icon and menu
    "pystray>=0.19.5",
    "Pillow>=10.3.0",

    # Structured logging extras
    "colorlog>=6.8.0",

    # Async SQLite — database layer
    "aiosqlite>=0.20.0",
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",

    # Type checking
    "mypy>=1.10.0",
    "types-beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",

    # Code quality
    "ruff>=0.4.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
]

# ---------------------------------------------------------------------------
# Console entry points
# ---------------------------------------------------------------------------
[project.scripts]
handshake-watcher = "handshake_watcher.cli.main:main"

# =============================================================================
# Hatch build configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/handshake_watcher"]

# =============================================================================
# Black — opinionated formatter
# =============================================================================
[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

# =============================================================================
# isort — import sorter (compatible with Black)
# =============================================================================
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["handshake_watcher"]
known_third_party = [
    "playwright",
    "bs4",
    "pydantic",
    "pydantic_settings",
    "plyer",
    "pystray",
    "PIL",
    "colorlog",
    "pytest",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
combine_as_imports = true

# =============================================================================
# Ruff — fast linter
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "ERA", # eradicate (commented-out code)
    "PL",  # Pylint
    "TRY", # tryceratops
    "PERF",# Perflint
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "TRY003",  # Avoid specifying long messages outside the exception class
    "S603",    # subprocess call — allowed, we call playwright CLI
    "S607",    # Starting a process with a partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Use of assert in tests is fine
    "ANN",    # No annotation requirements in tests
    "T20",    # print() allowed in test helpers
    "PLR2004",# Magic value comparisons in tests are fine
]
"scripts/**/*.py" = [
    "T20",    # print() allowed in scripts
    "ANN",    # No annotation requirements in scripts
]

[tool.ruff.lint.isort]
known-first-party = ["handshake_watcher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# mypy — static type checker
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "plyer",
    "plyer.*",
    "pystray",
    "pystray.*",
    "colorlog",
    "colorlog.*",
    "aiosqlite",
    "aiosqlite.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest — test runner
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Pure unit tests with no I/O",
    "integration: Integration tests that may touch the filesystem",
    "slow: Tests that take longer than 1 second",
    "db: Database tests touching the SQLite layer",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:playwright",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src/handshake_watcher"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "src/handshake_watcher/tray/*",  # GUI code excluded from coverage
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
